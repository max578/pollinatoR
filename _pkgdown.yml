url: https://max578.github.io/pollinatoR/

template:
  bootstrap: 5

reference:
  - title: Data
    desc: Declare the unit-of-record table and check it.
    contents:
      - pollin_data
      - pollin_validate
  - title: Design
    desc: Map treatment levels to arms and set the layout.
    contents:
      - pollin_design
  - title: Estimand
    desc: Name the contrast, the scale and the basis.
    contents:
      - pollin_estimand
      - pollin_assumptions
  - title: Identification
    desc: Causal graph, adjustment sets, cage bounds and sensitivity.
    contents:
      - pollin_dag
      - pollin_dag_check
      - pollin_bound
      - pollin_sensitivity
  - title: Population
    desc: Carry the estimand from the trial to a population of strata.
    contents:
      - pollin_population
  - title: Fit
    contents:
      - pollin_fit
  - title: Effects
    desc: Estimates and intervals on the estimand's scale.
    contents:
      - pollin_effects
      - pollin_cate
      - pollin_contribution
      - pollin_moderation
  - title: Draws
    desc: Draws of the estimand, for quantities computed per draw.
    contents:
      - pollin_draws
      - summary.pollin_draws
  - title: Value
    desc: Economic value of an estimand, computed per draw.
    contents:
      - pollin_market
      - pollin_value
      - summary.pollin_value
      - pollin_guard_doublecount
  - title: Guards
    contents:
      - pollin_guard_spurious
      - pollin_guard_bounded
      - pollin_guard_ecological
      - pollin_guard_posttreatment
  - title: Indices and utilities
    contents:
      - pollin_index
      - pollin_rii
      - pollin_compensation
      - pollin_decompose
      - pollin_within_between
      - pollin_fdr

articles:
  - title: Get started
    navbar: ~
    contents:
      - pollinatoR
  - title: Designs
    navbar: Designs
    contents:
      - three-arm-trial
      - split-plot-trial
      - matched-pair-field-study
      - identification
  - title: Value
    navbar: Value
    contents:
      - dependence-to-value
  - title: Bayesian fits
    navbar: Bayesian fits
    contents:
      - bayesian-fits
